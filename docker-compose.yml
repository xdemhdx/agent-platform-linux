services:
  agent-prod: &agent-common
    build:
      context: .
      dockerfile: base/Dockerfile
      args:
        NODE_MAJOR: ${NODE_MAJOR:-22}
        CODEX_NPM_PACKAGE: ${CODEX_NPM_PACKAGE:-@openai/codex}
    image: ${BASE_IMAGE_NAME:-agent-platform-linux-base}:latest
    container_name: agent-prod
    hostname: PROD-AZ
    environment:
      AGENT_NAME: agent-prod
      AGENT_ROLE: PROD
      AGENT_COLOR: 31
      TZ: ${TZ:-UTC}
    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
    command:
      - bash
      - -lc
      - trap 'exit 0' TERM INT; while true; do sleep 3600; done
    volumes:
      - ./prod-env/workspace:/workspace
      - ./prod-env/azure:/root/.azure
      - ./prod-env/codex:/root/.codex
    networks:
      - agent-net
    cpus: "${AGENT_CPU_LIMIT:-2.0}"
    mem_limit: ${AGENT_MEMORY_LIMIT:-2g}
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - bash -lc "command -v az >/dev/null && command -v codex >/dev/null && test -d /root/.azure && test -d /root/.codex && test -d /workspace"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  agent-lab:
    <<: *agent-common
    container_name: agent-lab
    hostname: LAB-AZ
    environment:
      AGENT_NAME: agent-lab
      AGENT_ROLE: LAB
      AGENT_COLOR: 33
      TZ: ${TZ:-UTC}
    volumes:
      - ./lab-env/workspace:/workspace
      - ./lab-env/azure:/root/.azure
      - ./lab-env/codex:/root/.codex

  agent-sandbox:
    <<: *agent-common
    container_name: agent-sandbox
    hostname: SANDBOX-AZ
    environment:
      AGENT_NAME: agent-sandbox
      AGENT_ROLE: SANDBOX
      AGENT_COLOR: 36
      TZ: ${TZ:-UTC}
    volumes:
      - ./sandbox-env/workspace:/workspace
      - ./sandbox-env/azure:/root/.azure
      - ./sandbox-env/codex:/root/.codex

networks:
  agent-net:
    driver: bridge
